services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ZENITH_ENVIRONMENT: docker
      ZENITH_DATABASE_URL: sqlite:////data/zenith.db
      ZENITH_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
